<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}"> 
    <title>{{ title or "Movie Dashboard" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color:  #f1f1f1 ;
            color:#121212;
            margin: 0;
            min-height: 100vh;
        }

        nav {
            background-color: #1e1e1e;
            padding: 1rem 2rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        nav a {
            color: #f1f1f1;
            text-decoration: none;
            margin-right: 1rem;
            font-weight: 500;
        }

        

        .container {
            max-width: 900px;
            margin: 2rem auto;
            background:  #f1f1f1 ;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            transition: background 0.3s;
        }

        

        .form-control, .form-select {
            background-color: #f1f1f1 ;
            border: 1px solid #ccc;
            color: black;
            border-radius: 8px;
        }

        

        .card {
            background-color: white;
            border: none;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .card-img-top {
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            height: 350px;
            object-fit: cover;
        }

        footer {
            text-align: center;
            padding: 1rem;
            color: #888;
            font-size: 0.9rem;
        }

        .alert {
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <nav class="d-flex justify-content-between align-items-center">
        
        <div>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('main.logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('main.login') }}">Login</a>
            {% endif %}
        </div>
        <script>
    async function ajaxSearch() {
      const query = document.querySelector('input[type="search"]').value.trim();
      if (!query) {
        alert("Please enter a search term!");
        return;
      }

      try {
        const response = await fetch(`/api/search_movies?q=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (data.error) {
          alert(data.error);
          return;
        }

        // Optionally redirect or display search results
        console.log("Search results:", data);
        // You can redirect to a search results page:
        window.location.href = `/search_results?q=${encodeURIComponent(query)}`;
      } catch (error) {
        console.error("Error:", error);
        alert("Something went wrong while searching.");
      }
    }
    </script>
        
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} mt-3">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>

    
</body>
</html>
