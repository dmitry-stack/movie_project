<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Edit Review</h2>
<form method="POST">
    {{ form.hidden_tag() }}
    <div class="mb-3">
        {{ form.content.label(class="form-label") }}
        {{ form.content(class="form-control") }}
    </div>
    {{ form.submit(class="btn btn-primary") }}
</form>
<a href="{{ url_for('movie_details', movie_id=review.movie_id) }}" class="btn btn-primary mt-3">Back to Movie Details</a>
</body>
</html>
