<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% extends "base.html" %}
    {% block content %}
<div class="container mt-5">
    <h2>Movies</h2>
    <div class="mb-3">
        <label for="genre">Filter by genre:</label>
        <form method="get" class="d-flex gap-2">
            <select name="genre" class="form-select w-auto">
                <option value="">All</option>
                {% for g in genres %}
                    <option value="{{ g }}" {% if request.args.get('genre') == g %}selected{% endif %}>{{ g }}</option>
                {% endfor %}
            </select>
            <button class="btn btn-primary">Filter</button>
        </form>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Title</th>
            <th>Genre</th>
            <th>Year</th>
            <th>Description</th>
            <th>Rating</th>
            <th>Poster</th>
        </tr>
        </thead>
        <tbody>
        {% for movie in movies %}
        <tr>
           <td><a href="{{ url_for('movie_details', movie_id=movie.id) }}">{{ movie.title }}</a></td>
            <td>{{ movie.genre }}</td>
            <td>{{ movie.year }}</td>
            <td>{{ movie.description }}</td>
            <td>{{ '%.1f' % movie.average_rating }} / 5</td>
            <td><img src="{{ movie.poster }}" alt="Poster for {{ movie.title }}"></td>
        </tr>
        {% endfor %}
        </tbody>
   
<a href="{{ url_for(current_user.role+'_dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
   
</div>
{% endblock %}

</body>
</html>
